id: no-throw
language: TypeScript
severity: error
message: |
  Don't throw. Return Result<T, E> from `better-result` instead.
  Wrap APIs that throw with `fromThrowable` / `tryAsync`.
  See: https://github.com/dmmulroy/better-result
note: |
  Migrated packages live in `files:`. Add the next package once it's converted
  (next up: pkg/obs, then pkg/daemons, then apps/*).
files:
  - "pkg/health/**/*.ts"
ignores:
  - "**/*.test.ts"
  - "**/*.integration.ts"
  - "**/test/**"
  - "**/fixtures/**"
rule:
  any:
    - pattern: throw new $ERR($$$)
    - pattern: throw $ERR
