name: Build app images

on:
  push:
    branches:
      - main

concurrency:
  group: build-app-images-main
  cancel-in-progress: false

jobs:
  build-images:
    name: build canonical app images
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      git_commit: ${{ github.sha }}
      image_tag: ${{ github.sha }}
      runner_label: ubuntu-24.04-arm
      platforms: linux/arm64
      enable_qemu: false
    secrets: inherit

  publish-release:
    name: publish release
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: extractions/setup-just@v2

      - name: Fetch tags
        run: git fetch --tags origin

      - name: Check for existing release tag on commit
        id: existing-tag
        run: |
          set -euo pipefail
          tag="$(git tag --points-at "${GITHUB_SHA}" --list 'v*' | head -n1 || true)"
          echo "value=${tag}" >> "$GITHUB_OUTPUT"

      - name: Compute next release tag
        if: steps.existing-tag.outputs.value == ''
        id: next-tag
        run: |
          set -euo pipefail
          echo "value=$(just ci::next-release-tag)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: steps.existing-tag.outputs.value == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ steps.next-tag.outputs.value }}"
          --target "${{ github.sha }}"
          --title "${{ steps.next-tag.outputs.value }}"
          --generate-notes
