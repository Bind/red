name: Daemon review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review with the workflow definition from the selected ref
        required: true
        type: string

env:
  DOTENV_PRIVATE_KEY_CI: ${{ secrets.DOTENV_PRIVATE_KEY_CI }}

jobs:
  daemon-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    timeout-minutes: 20
    steps:
      - name: Resolve PR metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            {
              echo "PR_NUMBER=${{ github.event.pull_request.number }}"
              echo "PR_BASE_SHA=${{ github.event.pull_request.base.sha }}"
              echo "PR_BASE_REF=${{ github.event.pull_request.base.ref }}"
              echo "PR_HEAD_SHA=${{ github.event.pull_request.head.sha }}"
              echo "PR_HEAD_REF=${{ github.event.pull_request.head.ref }}"
              echo "PR_HEAD_REPO=${{ github.event.pull_request.head.repo.full_name }}"
            } >> "$GITHUB_ENV"
            exit 0
          fi

          pr_json="$(gh api repos/${{ github.repository }}/pulls/${{ inputs.pr_number }})"
          {
            echo "PR_NUMBER=${{ inputs.pr_number }}"
            echo "PR_BASE_SHA=$(printf '%s' "$pr_json" | jq -r '.base.sha')"
            echo "PR_BASE_REF=$(printf '%s' "$pr_json" | jq -r '.base.ref')"
            echo "PR_HEAD_SHA=$(printf '%s' "$pr_json" | jq -r '.head.sha')"
            echo "PR_HEAD_REF=$(printf '%s' "$pr_json" | jq -r '.head.ref')"
            echo "PR_HEAD_REPO=$(printf '%s' "$pr_json" | jq -r '.head.repo.full_name')"
          } >> "$GITHUB_ENV"

      - name: Select daemon review source
        run: |
          if [ "$PR_HEAD_REPO" = "${{ github.repository }}" ]; then
            echo "DAEMON_REVIEW_WORKTREE=pr-head" >> "$GITHUB_ENV"
            echo "DAEMON_REVIEW_EXECUTION_SOURCE=pr-head" >> "$GITHUB_ENV"
          else
            echo "DAEMON_REVIEW_WORKTREE=trusted-base" >> "$GITHUB_ENV"
            echo "DAEMON_REVIEW_EXECUTION_SOURCE=trusted-base" >> "$GITHUB_ENV"
          fi

      - name: Checkout trusted base repo
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_BASE_SHA }}
          path: trusted-base
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout PR contents
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PR_HEAD_REPO }}
          ref: ${{ env.PR_HEAD_SHA }}
          path: pr-head
          fetch-depth: 1
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: extractions/setup-just@v2

      - name: Install dotenvx
        run: curl -fsS https://dotenvx.sh | sh

      - name: Install dependencies
        working-directory: ${{ env.DAEMON_REVIEW_WORKTREE }}
        run: bun install --frozen-lockfile

      - name: Configure git credentials for sandbox clones
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Run daemon review
        working-directory: ${{ env.DAEMON_REVIEW_WORKTREE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          PR_BASE_SHA: ${{ env.PR_BASE_SHA }}
          PR_BASE_REF: ${{ env.PR_BASE_REF }}
          PR_HEAD_SHA: ${{ env.PR_HEAD_SHA }}
          PR_HEAD_REF: ${{ env.PR_HEAD_REF }}
          PR_HEAD_REPO: ${{ env.PR_HEAD_REPO }}
          REPO_ROOT: ${{ github.workspace }}/pr-head
          DAEMON_REVIEW_EXECUTION_SOURCE: ${{ env.DAEMON_REVIEW_EXECUTION_SOURCE }}
          DAEMON_REVIEW_MAX_PARALLEL: "3"
          DAEMON_REVIEW_PROPOSAL_MODE: "true"
          DAEMON_REVIEW_ROUTER_MODE: "memory_embedding_librarian"
          DAEMON_REVIEW_ROUTER_PROVIDER: openrouter
          DAEMON_REVIEW_ROUTER_MODEL: openai/text-embedding-3-small
          DAEMON_REVIEW_LIBRARIAN_MODEL: deepseek/deepseek-v4-flash
          DAEMON_REVIEW_LIBRARIAN_MAX_MS: "240000"
          DAEMON_REVIEW_ROUTER_SCORE_THRESHOLD: "0.45"
          DAEMON_REVIEW_ROUTER_MAX_GAP: "0.08"
          DAEMON_REVIEW_ROUTER_TOP_K: "3"
          AI_DAEMONS_PROVIDER: openrouter
          AI_DAEMONS_MODEL: deepseek/deepseek-v4-flash
          AI_DAEMONS_MEMORY_BACKEND: r2
          AI_DAEMONS_MEMORY_REPO: ${{ github.repository }}
        run: dotenvx run -f .env.ci -- bun run bureau/workflows/daemon-review/src/main.ts
