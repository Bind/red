name: Release

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Build app images"]
    types: [completed]

concurrency:
  group: release
  cancel-in-progress: false

env:
  JUST_UNSTABLE: "1"
  DOTENV_PRIVATE_KEY_CI: ${{ secrets.DOTENV_PRIVATE_KEY_CI }}

jobs:
  release:
    name: provision + deploy + health check
    if: >
      github.event_name == 'release' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: extractions/setup-just@v2

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dotenvx
        run: curl -fsS https://dotenvx.sh | sh

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Resolve release context
        id: release
        run: |
          set -euo pipefail
          git fetch --tags origin
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            release_tag="${{ github.event.release.tag_name }}"
            release_sha="$(git rev-list -n 1 "$release_tag")"
          else
            release_sha="${{ github.event.workflow_run.head_sha }}"
            release_tag="$(git tag --points-at "$release_sha" --list 'v*' --sort=-version:refname | head -n1 || true)"
            if [[ -z "$release_tag" ]]; then
              echo "no v* release tag points at $release_sha"
              exit 1
            fi
          fi
          git checkout --detach "$release_sha"
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${release_sha}" >> "$GITHUB_OUTPUT"

      - name: Verify release commit is on main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "${{ steps.release.outputs.sha }}" origin/main

      - name: Assert prebuilt release images exist
        run: just ci::assert-release-images "${{ steps.release.outputs.sha }}"

      - name: Tag prebuilt images with release version
        run: just ci::retag-release-images "${{ steps.release.outputs.sha }}" "${{ steps.release.outputs.tag }}"

      - name: Validate CI secrets
        run: just ci::secrets-check .env.ci production

      - name: Provision infra
        run: dotenvx run -f .env.ci -- just provision production .env.ci

      - name: Resolve deployment target
        id: target
        run: |
          set -euo pipefail
          server_ip="$(dotenvx get RED_SERVER_IP -f .env.ci --format shell)"
          dns_record="$(dotenvx get RED_DNS_RECORD -f .env.ci --format shell)"
          if [[ -z "$server_ip" || -z "$dns_record" ]]; then
            echo "missing RED_SERVER_IP or RED_DNS_RECORD after provision"
            exit 1
          fi
          echo "server_ip=${server_ip}" >> "$GITHUB_OUTPUT"
          echo "dns_record=${dns_record}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH (private key from .env.ci)
        run: |
          mkdir -p ~/.ssh
          key="$(dotenvx get HETZNER_SSH_PRIVATE_KEY -f .env.ci --format shell)"
          if printf "%s" "$key" | grep -q "^-----BEGIN "; then
            printf "%s\n" "$key" > ~/.ssh/id_ed25519
          else
            printf "%s" "$key" | openssl base64 -d -A > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy code (rsync + docker compose up)
        run: just deploy-ssh "${{ steps.release.outputs.tag }}" "${{ steps.release.outputs.sha }}" "${{ steps.target.outputs.server_ip }}" 2222

      - name: Direct post-deploy health check
        run: just ci::wait-for-health "http://${{ steps.target.outputs.server_ip }}"

      - name: Promote production DNS
        run: just ci::promote-production-dns .env.ci

      - name: Wait for public DNS
        run: just ci::wait-for-dns "${{ steps.target.outputs.dns_record }}" "${{ steps.target.outputs.server_ip }}"

      - name: Post-deploy health check
        run: just ci::wait-for-health "https://${{ steps.target.outputs.dns_record }}"
