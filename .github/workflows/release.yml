name: Release

on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

env:
  JUST_UNSTABLE: "1"
  DOTENV_PRIVATE_KEY_CI: ${{ secrets.DOTENV_PRIVATE_KEY_CI }}

jobs:
  release:
    name: provision + deploy + health check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: extractions/setup-just@v2

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dotenvx
        run: curl -fsS https://dotenvx.sh | sh

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Resolve release commit
        id: release-sha
        run: |
          set -euo pipefail
          echo "value=$(git rev-list -n 1 "${{ github.event.release.tag_name }}")" >> "$GITHUB_OUTPUT"

      - name: Verify release commit is on main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "${{ steps.release-sha.outputs.value }}" origin/main

      - name: Assert prebuilt release images exist
        run: just ci::assert-release-images "${{ steps.release-sha.outputs.value }}"

      - name: Tag prebuilt images with release version
        run: just ci::retag-release-images "${{ steps.release-sha.outputs.value }}" "${{ github.event.release.tag_name }}"

      - name: Validate CI secrets
        run: just ci::secrets-check .env.ci production

      - name: Provision infra
        run: dotenvx run -f .env.ci -- just provision production .env.ci

      - name: Configure SSH (private key from .env.ci)
        run: |
          mkdir -p ~/.ssh
          key="$(dotenvx get HETZNER_SSH_PRIVATE_KEY -f .env.ci --format shell)"
          if printf "%s" "$key" | grep -q "^-----BEGIN "; then
            printf "%s\n" "$key" > ~/.ssh/id_ed25519
          else
            printf "%s" "$key" | openssl base64 -d -A > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy code (rsync + docker compose up)
        run: just deploy-ssh "${{ github.event.release.tag_name }}" "${{ steps.release-sha.outputs.value }}" red.computer 2222

      - name: Post-deploy health check
        run: just deploy-check https://red.computer
